[project]
name = "lexis-backend"
version = "0.1.0"
description = "Lexis backend service"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard]>=0.135.3,<0.136.0",
    "psycopg[binary]>=3.3.3,<4.0.0",
    "openai>=2.31.0,<3.0.0",
    "anthropic>=0.125.0,<1.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
]

[tool.poetry]
name = "app"
version = "0.1.0"
description = ""
authors = ["Devin AI <158243242+devin-ai-integration[bot]@users.noreply.github.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.135.3"}
psycopg = {extras = ["binary"], version = "^3.3.3"}
openai = "^2.31.0"
anthropic = "^0.125.0"
python-dotenv = "^1.2.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
